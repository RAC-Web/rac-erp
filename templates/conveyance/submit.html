{% extends 'base.html' %}
{% block page_title %}Submit Conveyance Bill{% endblock %}

{% block content %}
<div class="card border-0 shadow-sm col-md-8 mx-auto">
    <div class="card-body p-4 p-md-5">
        <h4 class="fw-bold mb-4"><i class="bi bi-car-front-fill me-2 text-primary"></i> Submit Conveyance Claim</h4>
        
        <form method="post" action="{% url 'conveyance:submit' %}" enctype="multipart/form-data">
            {% csrf_token %}
            
            <div class="row mb-4">
                <div class="col-md-6 mb-3 mb-md-0">
                    <label class="form-label fw-semibold">Date of Travel</label>
                    <input type="date" name="date" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Client</label>
                    <select name="client" class="form-select" required>
                        <option value="">Select Client</option>
                        {% for client in clients %}
                        <option value="{{ client.id }}">{{ client.name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            
            <div class="mb-4">
                <label class="form-label fw-semibold">Assignment</label>
                <select name="assignment" class="form-select" required>
                    <option value="">Select Assignment</option>
                    {% for assignment in assignments %}
                    <option value="{{ assignment.id }}">{{ assignment.title }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="row mb-4">
                <div class="col-md-6 mb-3 mb-md-0">
                    <label class="form-label fw-semibold">From Location</label>
                    <input type="text" name="from_location" class="form-control" required placeholder="e.g. Office">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">To Location</label>
                    <input type="text" name="to_location" class="form-control" required placeholder="e.g. Client Office">
                </div>
            </div>

            <div class="row mb-4">
                <div class="col-md-6 mb-3 mb-md-0">
                    <label class="form-label fw-semibold">Transport Mode</label>
                    <input type="text" name="transport" class="form-control" required placeholder="e.g. Bus, Uber, CNG">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Amount (BDT)</label>
                    <input type="number" step="0.01" name="amount" class="form-control" required>
                </div>
            </div>
            
            <div class="mb-4">
                <label class="form-label fw-semibold">Description</label>
                <textarea name="description" class="form-control" rows="2" placeholder="Purpose of travel..."></textarea>
            </div>
            
            <div class="mb-4">
                <label class="form-label fw-semibold">Attachment / Receipt (Optional)</label>
                <input type="file" name="attachment" class="form-control">
            </div>
            
            <div class="d-flex justify-content-end">
                <a href="{% url 'conveyance:list' %}" class="btn btn-light me-3 px-4">Cancel</a>
                <button type="submit" class="btn btn-primary px-5 fw-bold shadow-sm">Submit Claim</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
