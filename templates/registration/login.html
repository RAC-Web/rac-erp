{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block auth_content %}
<div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="col-12 col-md-5 col-lg-4">
        <div class="card shadow border-0 p-5 rounded-4 bg-body">
            <div class="text-center mb-5">
                <div class="bg-primary bg-opacity-10 p-3 rounded-circle d-inline-block mb-3">
                    <i class="bi bi-buildings-fill text-primary" style="font-size: 2rem;"></i>
                </div>
                <h3 class="fw-bold text-primary mb-1">RAC HRMS</h3>
                <p class="text-muted mb-0">Sign in to your account</p>
            </div>
            
            {% if form.errors %}
            <div class="alert alert-danger py-2 border-0 shadow-sm rounded-3">
                <small class="fw-semibold"><i class="bi bi-exclamation-triangle-fill me-2"></i>Invalid username or password.</small>
            </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                {{ form|crispy }}
                <div class="d-grid gap-2 mt-5">
                    <button type="submit" class="btn btn-primary py-3 fw-bold rounded-3 shadow-sm">Sign In</button>
                </div>
                <input type="hidden" name="next" value="{{ next|default:'/' }}">
            </form>
        </div>
    </div>
</div>
{% endblock %}
